name: Actualizar prensa destacada

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-press-highlights
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar noticias desde fuentes públicas
        run: python scripts/update_press_highlights.py
      - name: Verificar el generador
        run: python -m unittest discover -s tests
      - name: Publicar cambios
        run: |
          if git diff --quiet -- prensa_destacada.js; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prensa_destacada.js
          git commit -m "chore: actualizar prensa destacada"
          git push
